<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  body{font-family:sans-serif; padding:10px}
  #stage{position:relative; display:inline-block; margin-top:10px}
  #img{max-width:100%; display:block}
.word{
    position:absolute;
    background:transparent;
    color:transparent;
    outline:none; cursor:text;
    border:1px dashed transparent;
    padding:0; margin:0; line-height:1;
    overflow:hidden; white-space:nowrap;
  }
.word:hover{border-color:#0084ff}
.word:focus{
    background:white; color:black;
    border-color:red;
  }
.word.top:focus{background:black; color:white;}
.eraser{position:absolute; background:rgba(255,0,0,0.35); border:2px solid red}
</style>
</head>
<body>
<input type="file" id="upload">
<button id="editBtn">EDIT ALL</button>
<button id="eraseBtn" style="background:red; color:white; border:none; padding:6px 10px; border-radius:4px;">ERASE ICON</button>
<button id="saveBtn" style="background:#0084ff; color:white; border:none; padding:6px 12px; border-radius:4px;">SAVE</button>

<div id="stage">
  <img id="img">
  <div id="layers" style="position:absolute; left:0; top:0; width:100%; height:100%"></div>
</div>

<script>
const img=document.getElementById('img'); const layers=document.getElementById('layers');
let eraseMode=false, startX, startY, curBox=null;

document.getElementById('upload').onchange=e=>{img.src=URL.createObjectURL(e.target.files[0]); layers.innerHTML='';}

document.getElementById('eraseBtn').onclick=()=>{
  eraseMode=!eraseMode;
  eraseBtn.style.background=eraseMode?'black':'red';
  eraseBtn.innerText=eraseMode?'DRAW OVER ICON':'ERASE ICON';
}
layers.addEventListener('pointerdown',e=>{
  if(!eraseMode) return;
  const r=layers.getBoundingClientRect();
  startX=e.clientX-r.left; startY=e.clientY-r.top;
  curBox=document.createElement('div'); curBox.className='eraser';
  curBox.style.left=startX+'px'; curBox.style.top=startY+'px';
  curBox.style.width='5px'; curBox.style.height='5px';
  curBox.dataset.top=(startY < r.height*0.15)?'1':'0';
  layers.appendChild(curBox);
});
layers.addEventListener('pointermove',e=>{
  if(!curBox) return;
  const r=layers.getBoundingClientRect();
  const x=e.clientX-r.left, y=e.clientY-r.top;
  curBox.style.width=Math.abs(x-startX)+'px'; curBox.style.height=Math.abs(y-startY)+'px';
  curBox.style.left=Math.min(x,startX)+'px'; curBox.style.top=Math.min(y,startY)+'px';
});
layers.addEventListener('pointerup',()=>curBox=null);

document.getElementById('editBtn').onclick=async()=>{
  layers.innerHTML='Detecting...';
  const {data}=await Tesseract.recognize(img.src,'eng');
  layers.innerHTML=''; const scale=img.naturalWidth/img.clientWidth; const H=img.naturalHeight;
  data.words.forEach(w=>{
    if(w.text.trim()==='') return;
    if(w.confidence < 70) return; // FIX 1: no fake R
    const h=w.bbox.y1-w.bbox.y0;
    if(h < 20) return; // FIX 2: no tiny X
    if(w.text.trim().length === 1) return; // FIX 3: no R, E
    if(w.bbox.y0 > H*0.28 && w.bbox.y0 < H*0.52) return; // FIX 4: BLOCK white toolbar = no E_1

    let txt=w.text.trim();
    if(txt.includes('%')){
      const m=txt.match(/(\d{1,3})%/);
      if(m) txt=m[0]; else return;
    }
    if(txt.includes('DREP')||txt.includes('PARGM')||txt.length>15) return;
    const isTop=w.bbox.y0 < H*0.12;
    if(isTop &&!txt.includes('%') &&!txt.includes(':') &&!/^\d+$/.test(txt) &&!txt.includes('Vo')) return;

    const d=document.createElement('div'); d.className='word'+(isTop?' top':'');
    d.contentEditable=true; d.innerText=txt; d.dataset.top=isTop?'1':'0';
    d.style.left=(w.bbox.x0/scale)+'px'; d.style.top=(w.bbox.y0/scale)+'px';
    d.style.width=((w.bbox.x1-w.bbox.x0)/scale+6)+'px'; d.style.height=(h/scale+4)+'px';
    d.style.fontSize=(h/scale*0.9)+'px';
    d.ondblclick=()=>d.remove();
    layers.appendChild(d);
  });
}

document.getElementById('saveBtn').onclick=()=>{
  const canvas=document.createElement('canvas'); canvas.width=img.naturalWidth; canvas.height=img.naturalHeight;
  const ctx=canvas.getContext('2d'); ctx.drawImage(img,0,0,canvas.width,canvas.height);
  const scale=canvas.width/img.clientWidth;
  document.querySelectorAll('.word,.eraser').forEach(el=>{
    const x=parseFloat(el.style.left)*scale; const y=parseFloat(el.style.top)*scale;
    const w=parseFloat(el.style.width)*scale; const h=parseFloat(el.style.height)*scale;
    const isTop=el.dataset.top==='1';
    if(el.classList.contains('word')){
      const fs=parseFloat(el.style.fontSize)*scale;
      ctx.fillStyle=isTop?'black':'white'; ctx.fillRect(x-2,y-2,w+4,h+4);
      ctx.fillStyle=isTop?'white':'black'; ctx.font=`${fs}px sans-serif`; ctx.textBaseline='top';
      ctx.fillText(el.innerText,x,y);
    }else{
      ctx.fillStyle=isTop?'black':'white'; ctx.fillRect(x,y,w,h);
    }
  });
  // FIX GLITCH: JPEG blob not PNG dataURL
  canvas.toBlob(blob=>{
    const url=URL.createObjectURL(blob);
    img.src=url; layers.innerHTML='';
    const a=document.createElement('a'); a.download='edited.jpg'; a.href=url; a.click();
  },'image/jpeg',0.95);
}
</script>
</body>
</html>
