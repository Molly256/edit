<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  #stage{position:relative; display:inline-block}
  #img{max-width:100%; display:block}
.word{position:absolute; background:transparent; border:none; outline:none; padding:0; margin:0; white-space:nowrap}
</style>
</head>
<body>
<input type="file" id="upload">
<button id="editBtn">EDIT</button>
<button id="saveBtn">SAVE</button>
<div id="stage"><img id="img"><div id="layers" style="position:absolute;left:0;top:0;width:100%;height:100%"></div></div>

<script>
const img=document.getElementById('img'), layers=document.getElementById('layers');
let detected=[];

upload.onchange=e=>{
  img.src=URL.createObjectURL(e.target.files[0]);
  layers.innerHTML=''; detected=[];
}

editBtn.onclick=async()=>{
  const {data}=await Tesseract.recognize(img.src,'eng');
  detected=data.words.filter(w=>{
    const t=w.text.trim(); if(!t)return false;
    if(w.confidence<80)return false;
    if(t.length===1 &&!/[0-9%]/.test(t))return false;
    if(w.bbox.y0 < img.naturalHeight*0.12) return false;
    return true;
  });
  alert(detected.length+' texts ready. Now TAP any text on image to edit it');
}

// TAP on image to edit THAT text only
layers.addEventListener('click',async e=>{
  if(!detected.length) return;
  const rect=layers.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(img.naturalWidth/img.clientWidth);
  const y=(e.clientY-rect.top)*(img.naturalHeight/img.clientHeight);

  // find clicked word
  const w=detected.find(w=> x>=w.bbox.x0 && x<=w.bbox.x1 && y>=w.bbox.y0 && y<=w.bbox.y1 );
  if(!w) return;

  // erase ONLY this one real text from image now
  const c=document.createElement('canvas');
  c.width=img.naturalWidth; c.height=img.naturalHeight;
  const ctx=c.getContext('2d');
  ctx.drawImage(img,0,0);
  const pix=ctx.getImageData(Math.max(0,w.bbox.x0-10),Math.max(0,w.bbox.y0-10),1,1).data;
  ctx.fillStyle=`rgb(${pix[0]},${pix[1]},${pix[2]})`;
  ctx.fillRect(w.bbox.x0-2,w.bbox.y0-2,w.bbox.x1-w.bbox.x0+4,w.bbox.y1-w.bbox.y0+4);
  img.src=c.toDataURL();

  await new Promise(r=>img.onload=r);

  // create editable ONLY for that word
  const scale=img.clientWidth/img.naturalWidth;
  const d=document.createElement('div');
  d.className='word';
  d.contentEditable=true;
  d.innerText=w.text.trim();
  d.style.left=(w.bbox.x0*scale)+'px';
  d.style.top=(w.bbox.y0*scale)+'px';
  d.style.fontSize=((w.bbox.y1-w.bbox.y0)*scale)+'px';
  d.style.color='black';
  d.style.fontFamily='sans-serif';
  layers.appendChild(d);
  setTimeout(()=>d.focus(),100);

  // remove from list so not edited again
  detected=detected.filter(v=>v!==w);

  d.addEventListener('keydown',ev=>{
    if(ev.key==='Backspace' && d.innerText.trim()===''){
      d.remove();
    }
  });
});

saveBtn.onclick=()=>{
  const canvas=document.createElement('canvas');
  canvas.width=img.naturalWidth; canvas.height=img.naturalHeight;
  const ctx=canvas.getContext('2d');
  ctx.drawImage(img,0,0);
  const s=img.naturalWidth/img.clientWidth;
  document.querySelectorAll('.word').forEach(el=>{
    if(!el.innerText.trim()) return;
    const x=parseFloat(el.style.left)*s;
    const y=parseFloat(el.style.top)*s;
    const fs=parseFloat(el.style.fontSize)*s;
    ctx.fillStyle='black';
    ctx.font=`${fs}px sans-serif`;
    ctx.textBaseline='top';
    ctx.fillText(el.innerText,x,y);
  });
  img.src=canvas.toDataURL();
  layers.innerHTML='';
}
</script>
</body>
</html>
