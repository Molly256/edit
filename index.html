<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  body{font-family:sans-serif; padding:10px}
  #stage{position:relative; display:inline-block; margin-top:10px}
  #img{max-width:100%; display:block}
.word{
    position:absolute;
    background:white;
    outline:none;
    cursor:text;
    border:1px dashed #0084ff;
    padding:0;
    margin:0;
    line-height:1;
    overflow:hidden;
    white-space:nowrap;
  }
.word:focus{border-color:red; background:#fffbe6}
.eraser{position:absolute; background:rgba(255,0,0,0.35); border:2px dashed red}
</style>
</head>
<body>

<input type="file" id="upload">
<button id="editBtn">EDIT ALL</button>
<button id="eraseBtn" style="background:red; color:white; border:none; padding:6px 10px; border-radius:4px;">ERASE ICON</button>
<button id="saveBtn" style="background:#0084ff; color:white; border:none; padding:6px 12px; border-radius:4px;">SAVE</button>
<p style="font-size:11px">Double-click a box to delete it • Erase mode: drag to cover icon</p>

<div id="stage">
  <img id="img">
  <div id="layers" style="position:absolute; left:0; top:0; width:100%; height:100%"></div>
</div>

<script>
const img = document.getElementById('img');
const layers = document.getElementById('layers');
let eraseMode=false, sx, sy, cur=null;

document.getElementById('upload').onchange = e => {
  img.src = URL.createObjectURL(e.target.files[0]);
  layers.innerHTML = '';
}

document.getElementById('eraseBtn').onclick = () => {
  eraseMode=!eraseMode;
  eraseBtn.innerText=eraseMode?'DRAW TO ERASE':'ERASE ICON';
  eraseBtn.style.background=eraseMode?'black':'red';
}

layers.addEventListener('pointerdown',e=>{
  if(!eraseMode) return;
  const r=layers.getBoundingClientRect();
  sx=e.clientX-r.left; sy=e.clientY-r.top;
  cur=document.createElement('div'); cur.className='eraser';
  cur.style.left=sx+'px'; cur.style.top=sy+'px';
  cur.dataset.top=(sy < r.height*0.18)?'1':'0';
  layers.appendChild(cur);
});
layers.addEventListener('pointermove',e=>{
  if(!cur) return;
  const r=layers.getBoundingClientRect();
  const x=e.clientX-r.left, y=e.clientY-r.top;
  cur.style.width=Math.abs(x-sx)+'px'; cur.style.height=Math.abs(y-sy)+'px';
  cur.style.left=Math.min(x,sx)+'px'; cur.style.top=Math.min(y,sy)+'px';
});
layers.addEventListener('pointerup',()=>cur=null);

document.getElementById('editBtn').onclick = async () => {
  layers.innerHTML = 'Detecting...';
  const { data } = await Tesseract.recognize(img.src, 'eng');
  layers.innerHTML = '';
  const scale = img.naturalWidth / img.clientWidth;
  const H = img.naturalHeight;

  data.words.forEach(w => {
    if (w.text.trim() === '') return;
    // BATTERY FIX: 582% -> 82% and block R DEPA
    let txt = w.text.trim();
    if(txt==='R' || txt==='R|' || txt==='WH' || txt.includes('DEPA')) return;
    if(txt.includes('%')){
      let m=txt.match(/(\d{1,3})%/);
      if(m){ let n=parseInt(m[1]); if(n>100) n=n%100; txt=n+'%'; } else return;
    }
    if (txt.includes('DREP') || txt.includes('PARGM') || txt.length > 15) return;
    if (w.bbox.y0 > H*0.20 && w.bbox.y0 < H*0.55) return;

    const b = w.bbox;
    const d = document.createElement('div');
    d.className = 'word';
    d.contentEditable = true;
    d.innerText = txt;
    d.dataset.top = b.y0 < H*0.18? '1':'0';
    d.style.left = (b.x0 / scale) + 'px';
    d.style.top = (b.y0 / scale) + 'px';
    d.style.width = ((b.x1-b.x0)/scale + 4) + 'px';
    d.style.height = ((b.y1-b.y0)/scale + 2) + 'px';
    d.style.fontSize = ((b.y1-b.y0)/scale * 0.9) + 'px';
    d.style.fontFamily = 'sans-serif';
    d.ondblclick = () => d.remove();
    layers.appendChild(d);
  });
}

document.getElementById('saveBtn').onclick = () => {
  const canvas = document.createElement('canvas');
  canvas.width = img.naturalWidth;
  canvas.height = img.naturalHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0);
  const scale = img.naturalWidth / img.clientWidth;
  document.querySelectorAll('.word,.eraser').forEach(el => {
    const x = parseFloat(el.style.left) * scale;
    const y = parseFloat(el.style.top) * scale;
    const h = parseFloat(el.style.height) * scale;
    const fontSize = parseFloat(el.style.fontSize) * scale;
    const isTop = el.dataset.top==='1';
    if(el.classList.contains('eraser')){
      ctx.fillStyle=isTop?'black':'white';
      ctx.fillRect(x,y,parseFloat(el.style.width)*scale,h);
    } else {
      ctx.fillStyle = isTop? 'black' : 'white';
      ctx.fillRect(x, y, parseFloat(el.style.width)*scale, h);
      ctx.fillStyle = isTop? 'white' : 'black';
      ctx.font = `${fontSize}px sans-serif`;
      ctx.textBaseline = 'top';
      ctx.fillText(el.innerText, x, y);
    }
  });
  const newSrc = canvas.toDataURL('image/png');
  img.src = newSrc;
  layers.innerHTML = '';
  const a = document.createElement('a');
  a.download = 'edited.png';
  a.href = newSrc;
  a.click();
}
</script>
</body>
</html>
