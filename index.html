<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  body{font-family:sans-serif; padding:10px}
  #stage{position:relative; display:inline-block; margin-top:10px}
  #img{max-width:100%; display:block}
.word{
    position:absolute;
    background:white;
    outline:none;
    cursor:text;
    border:1px dashed transparent;
    padding:0 2px;
    line-height:1;
  }
.word:focus{border-color:#0084ff}
</style>
</head>
<body>

<input type="file" id="upload">
<button id="editBtn">EDIT</button>
<button id="saveBtn" style="background:#0084ff; color:white; border:none; padding:6px 12px; border-radius:4px;">SAVE</button>

<div id="stage">
  <img id="img">
  <div id="layers" style="position:absolute; left:0; top:0; width:100%; height:100%"></div>
</div>

<script>
const img = document.getElementById('img');
const layers = document.getElementById('layers');

document.getElementById('upload').onchange = e => {
  img.src = URL.createObjectURL(e.target.files[0]);
  layers.innerHTML = '';
}

document.getElementById('editBtn').onclick = async () => {
  layers.innerHTML = 'Detecting...';
  const { data } = await Tesseract.recognize(img.src, 'eng');
  layers.innerHTML = '';
  const scale = img.naturalWidth / img.clientWidth;
  data.words.forEach(w => {
    const b = w.bbox;
    const d = document.createElement('div');
    d.className = 'word';
    d.contentEditable = true;
    d.innerText = w.text;
    d.style.left = (b.x0 / scale) + 'px';
    d.style.top = (b.y0 / scale) + 'px';
    d.style.width = ((b.x1-b.x0)/scale + 10) + 'px';
    d.style.fontSize = ((b.y1-b.y0)/scale) + 'px';
    layers.appendChild(d);
  });
}

// NEW SAVE LOGIC
document.getElementById('saveBtn').onclick = () => {
  if (!img.src) return alert('Upload image first');
  if (layers.children.length === 0) return alert('Nothing to save - click EDIT first');

  const canvas = document.createElement('canvas');
  canvas.width = img.naturalWidth;
  canvas.height = img.naturalHeight;
  const ctx = canvas.getContext('2d');

  // 1. Draw original image
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

  // 2. Draw each edited word onto image
  const scale = img.naturalWidth / img.clientWidth;
  document.querySelectorAll('.word').forEach(el => {
    const x = parseFloat(el.style.left) * scale;
    const y = parseFloat(el.style.top) * scale;
    const fontSize = parseFloat(el.style.fontSize) * scale;
    const text = el.innerText;

    // Cover old text with white
    ctx.fillStyle = 'white';
    ctx.fillRect(x-2, y-2, parseFloat(el.style.width)*scale + 10, fontSize + 8);

    // Write new text
    ctx.fillStyle = 'black';
    ctx.font = `${fontSize}px sans-serif`;
    ctx.textBaseline = 'top';
    ctx.fillText(text, x, y);
  });

  // 3. Make canvas result the NEW original image
  const newSrc = canvas.toDataURL('image/png');
  img.src = newSrc;
  layers.innerHTML = ''; // clear editable boxes

  // 4. Download also
  const a = document.createElement('a');
  a.download = 'edited.png';
  a.href = newSrc;
  a.click();
}
</script>
</body>
</html>
