<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  body { font-family: sans-serif; padding: 10px; background: #f0f2f5; color: #333; }
  #controls { margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button { padding: 6px 12px; border-radius: 4px; border: 1px solid #ccc; cursor: pointer; font-weight: bold; }
  #editBtn { background: #0084ff; color: white; border: none; }
  #saveBtn { background: #28a745; color: white; border: none; }
  #btnRed { background: #dc3545; color: white; border: none; }
  #btnGreen { background: #28a745; color: white; border: none; }
  #eraserBtn { background: #6c757d; color: white; border: none; }
  #eraserBtn.active { background: #ffc107; color: black; outline: 2px solid black; }
  #stage { position: relative; display: inline-block; margin-top: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
  #img { max-width: 100%; display: block; }
 .word {
    position: absolute;
    outline: none;
    cursor: text;
    border: 1px dashed #0084ff;
    padding: 0 2px;
    margin: 0;
    line-height: 1;
    overflow: hidden;
    white-space: nowrap;
  }
 .word:focus { border-color: red; outline: 1px solid red; }
 .eraser-cursor { cursor: crosshair!important; }
</style>
</head>
<body>

<div id="controls">
  <input type="file" id="upload" accept="image/*">
  <button id="editBtn">EDIT ALL</button>
  <button id="btnRed">BATTERY -</button>
  <button id="btnGreen">BATTERY +</button>
  <button id="eraserBtn">ERASER TOOL</button>
  <button id="saveBtn">SAVE</button>
</div>
<p style="font-size:11px; margin: 5px 0;">Double-click a text box to delete it. Eraser yellow = click to wipe icon.</p>

<div id="stage">
  <img id="img">
  <div id="layers" style="position:absolute; left:0; top:0; width:100%; height:100%"></div>
</div>

<script>
const img = document.getElementById('img');
const layers = document.getElementById('layers');
const eraserBtn = document.getElementById('eraserBtn');
let isEraserActive = false;

document.getElementById('upload').onchange = e => {
  if(e.target.files && e.target.files[0]) {
    img.src = URL.createObjectURL(e.target.files[0]);
    layers.innerHTML = '';
  }
}

eraserBtn.onclick = () => {
  isEraserActive =!isEraserActive;
  eraserBtn.classList.toggle('active', isEraserActive);
  layers.classList.toggle('eraser-cursor', isEraserActive);
};

layers.onclick = (e) => {
  if (!isEraserActive) return;
  const rect = layers.getBoundingClientRect();
  const clickX = e.clientX - rect.left;
  const clickY = e.clientY - rect.top;
  const scale = img.naturalWidth / img.clientWidth;

  const canvas = document.createElement('canvas');
  canvas.width = img.naturalWidth;
  canvas.height = img.naturalHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0);
  const sampleX = Math.round(clickX * scale);
  const sampleY = Math.round(clickY * scale);
  const p = ctx.getImageData(Math.max(0, sampleX - 5), Math.max(0, sampleY - 5), 1, 1).data;
  const bgRGB = `rgb(${p[0]},${p[1]},${p[2]})`;

  const eraseBox = document.createElement('div');
  eraseBox.style.position = 'absolute';
  eraseBox.style.left = (clickX - 12) + 'px';
  eraseBox.style.top = (clickY - 12) + 'px';
  eraseBox.style.width = '24px';
  eraseBox.style.height = '24px';
  eraseBox.style.background = bgRGB;
  eraseBox.className = 'erased-patch';
  eraseBox.setAttribute('data-raw-x', (clickX - 12) * scale);
  eraseBox.setAttribute('data-raw-y', (clickY - 12) * scale);
  eraseBox.setAttribute('data-raw-w', 24 * scale);
  eraseBox.setAttribute('data-raw-h', 24 * scale);
  eraseBox.setAttribute('data-bg', bgRGB);
  eraseBox.ondblclick = () => eraseBox.remove();
  layers.appendChild(eraseBox);
};

document.getElementById('editBtn').onclick = async () => {
  if(!img.src) return alert("Please upload an image first!");
  layers.innerHTML = 'Detecting ALL text...';

  // FIXED: Don't destroy gray - use original for detection
  const { data } = await Tesseract.recognize(img.src, 'eng');

  layers.innerHTML = '';
  const scale = img.naturalWidth / img.clientWidth;
  const H = img.naturalHeight;
  const W = img.naturalWidth;

  const baseCanvas = document.createElement('canvas');
  baseCanvas.width = W; baseCanvas.height = H;
  const baseCtx = baseCanvas.getContext('2d');
  baseCtx.drawImage(img, 0, 0);

  data.words.forEach(w => {
    let t = w.text.trim();
    if (t === '') return;
    // ONLY block true garbage, not all long text
    if (t.length > 30) return; // allow bc1 address up to 30

    const b = w.bbox;
    // Fix fake battery like (430%
    if(t.includes('%')){
      let m=t.match(/(\d{1,3})/);
      if(m){ let n=parseInt(m[1]); while(n>100) n%=100; t=n+'%'; }
    }

    const sX = Math.floor(b.x0);
    const sY = Math.floor(b.y0);
    const pixel = baseCtx.getImageData(Math.max(0, sX - 2), Math.max(0, sY - 2), 1, 1).data;
    const bgRGB = `rgb(${pixel[0]},${pixel[1]},${pixel[2]})`;
    const isDark = ((pixel[0] + pixel[1] + pixel[2]) / 3) < 130;
    const textRGB = isDark? 'white' : 'black';

    const d = document.createElement('div');
    d.className = 'word';
    d.contentEditable = true;
    d.innerText = t;
    if(t.includes('%')) d.classList.add('battery-node');

    d.setAttribute('data-bg', bgRGB);
    d.setAttribute('data-text-color', textRGB);
    d.style.background = bgRGB;
    d.style.color = textRGB;

    d.style.left = (b.x0 / scale) + 'px';
    d.style.top = (b.y0 / scale) + 'px';
    d.style.width = ((b.x1 - b.x0) / scale + 8) + 'px';
    d.style.height = ((b.y1 - b.y0) / scale + 4) + 'px';
    d.style.fontSize = ((b.y1 - b.y0) / scale * 0.95) + 'px';
    d.style.fontFamily = 'sans-serif';
    d.style.fontWeight = 'bold';
    d.ondblclick = () => d.remove();
    layers.appendChild(d);
  });
};

function changeBatteryValue(amount) {
  document.querySelectorAll('.battery-node').forEach(el => {
    let num = parseInt(el.innerText.replace(/[^0-9]/g, ''));
    if (!isNaN(num)) {
      let nextNum = Math.max(0, Math.min(100, num + amount));
      el.innerText = nextNum + '%';
    }
  });
}
document.getElementById('btnRed').onclick = () => changeBatteryValue(-1);
document.getElementById('btnGreen').onclick = () => changeBatteryValue(1);

document.getElementById('saveBtn').onclick = () => {
  const canvas = document.createElement('canvas');
  canvas.width = img.naturalWidth;
  canvas.height = img.naturalHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0);
  const scale = img.naturalWidth / img.clientWidth;

  document.querySelectorAll('.erased-patch').forEach(patch => {
    ctx.fillStyle = patch.getAttribute('data-bg');
    ctx.fillRect(parseFloat(patch.getAttribute('data-raw-x')), parseFloat(patch.getAttribute('data-raw-y')), parseFloat(patch.getAttribute('data-raw-w')), parseFloat(patch.getAttribute('data-raw-h')));
  });

  document.querySelectorAll('.word').forEach(el => {
    const x = parseFloat(el.style.left) * scale;
    const y = parseFloat(el.style.top) * scale;
    const w = parseFloat(el.style.width) * scale;
    const h = parseFloat(el.style.height) * scale;
    const fontSize = parseFloat(el.style.fontSize) * scale;
    ctx.fillStyle = el.getAttribute('data-bg');
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = el.getAttribute('data-text-color');
    ctx.font = `bold ${fontSize}px sans-serif`;
    ctx.textBaseline = 'top';
    ctx.fillText(el.innerText, x, y);
  });

  const newSrc = canvas.toDataURL('image/png');
  img.src = newSrc;
  layers.innerHTML = '';
  const a = document.createElement('a'); a.download = 'edited.png'; a.href = newSrc; a.click();
}
</script>
</body>
</html>
