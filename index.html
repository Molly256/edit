<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  #stage{position:relative; display:inline-block}
  #img{max-width:100%; display:block}
 .word{
    position:absolute;
    background:transparent;
    border:none;
    outline:none;
    padding:0;
    margin:0;
    white-space:nowrap;
    cursor:text;
  }
 .word:focus{background:rgba(255,255,230,0.9)}
</style>
</head>
<body>

<input type="file" id="upload">
<button id="editBtn">EDIT ALL</button>
<button id="saveBtn">SAVE</button>

<div id="stage">
  <img id="img">
  <div id="layers" style="position:absolute; left:0; top:0; width:100%; height:100%"></div>
</div>

<script>
const img=document.getElementById('img');
const layers=document.getElementById('layers');

upload.onchange=e=>{
  img.src=URL.createObjectURL(e.target.files[0]);
  layers.innerHTML='';
}

editBtn.onclick=async()=>{
  const {data}=await Tesseract.recognize(img.src,'eng');
  const scale=img.naturalWidth/img.clientWidth;

  // erase original text so no double text
  const c=document.createElement('canvas');
  c.width=img.naturalWidth; c.height=img.naturalHeight;
  const ctx=c.getContext('2d');
  ctx.drawImage(img,0,0);
  data.words.forEach(w=>{
    const b=w.bbox;
    ctx.fillStyle='white';
    ctx.fillRect(b.x0,b.y0,b.x1-b.x0,b.y1-b.y0);
  });
  img.src=c.toDataURL();

  layers.innerHTML='';
  data.words.forEach(w=>{
    let t=w.text.trim(); if(!t)return;
    const b=w.bbox;
    const d=document.createElement('div');
    d.className='word';
    d.contentEditable=true;
    d.innerText=t;
    d.style.left=(b.x0/scale)+'px';
    d.style.top=(b.y0/scale)+'px';
    d.style.fontSize=((b.y1-b.y0)/scale)+'px';
    d.style.fontFamily='sans-serif';
    d.style.color='black';
    layers.appendChild(d);
  });
}

saveBtn.onclick=()=>{
  const canvas=document.createElement('canvas');
  canvas.width=img.naturalWidth; canvas.height=img.naturalHeight;
  const ctx=canvas.getContext('2d');
  ctx.drawImage(img,0,0);
  const scale=img.naturalWidth/img.clientWidth;
  document.querySelectorAll('.word').forEach(el=>{
    const x=parseFloat(el.style.left)*scale;
    const y=parseFloat(el.style.top)*scale;
    const fs=parseFloat(el.style.fontSize)*scale;
    ctx.fillStyle='black';
    ctx.font=`${fs}px sans-serif`;
    ctx.textBaseline='top';
    ctx.fillText(el.innerText,x,y);
  });
  const src=canvas.toDataURL();
  img.src=src;
  layers.innerHTML='';
}
</script>
</body>
</html>
